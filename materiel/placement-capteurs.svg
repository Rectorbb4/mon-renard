<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 980" width="1200" height="980" font-family="Segoe UI, Roboto, Arial, sans-serif">
  <title>Où placer les capteurs de Mon renard</title>
  <rect width="1200" height="980" fill="#f6f4ef"/>
  <text x="40" y="58" font-size="34" font-weight="700" fill="#1f2a30">Où placer les capteurs</text>
  <text x="40" y="92" font-size="19" fill="#5b6770">Exemple pour un droitier : le boîtier et les doigts côté main gauche (la main qui travaille le moins).</text>

  <!-- ===== Panneau 1 : le corps ===== -->
  <rect x="30" y="120" width="540" height="830" rx="22" fill="#ffffff" stroke="#e2ddd2"/>
  <text x="56" y="162" font-size="22" font-weight="700" fill="#1f2a30">Vue de face</text>
  <g fill="#f1d9c4" stroke="#c9a88c" stroke-width="2">
    <circle cx="300" cy="235" r="48"/>
    <rect x="282" y="278" width="36" height="30" rx="6"/>
    <path d="M190 315 Q300 290 410 315 L428 470 Q420 600 390 690 L210 690 Q180 600 172 470 Z"/>
    <!-- bras droit de la personne (à gauche de l'image) -->
    <path d="M192 318 Q150 330 140 380 L118 600 Q116 640 130 660 L152 662 Q162 640 160 605 L190 420 Z"/>
    <!-- bras gauche de la personne (à droite de l'image) -->
    <path d="M408 318 Q450 330 460 380 L482 600 Q484 640 470 660 L448 662 Q438 640 440 605 L410 420 Z"/>
    <ellipse cx="141" cy="690" rx="22" ry="34"/>
    <ellipse cx="459" cy="690" rx="22" ry="34"/>
    <rect x="215" y="690" width="80" height="60" rx="18"/>
    <rect x="305" y="690" width="80" height="60" rx="18"/>
  </g>
  <!-- ceinture cardio -->
  <path d="M176 440 Q300 458 424 440 L426 462 Q300 480 174 462 Z" fill="#2b3338"/>
  <ellipse cx="300" cy="458" rx="40" ry="17" fill="#e8743b" stroke="#a84c1e" stroke-width="2"/>
  <path d="M300 468 l-9 -9 a5.5 5.5 0 0 1 9 -6 a5.5 5.5 0 0 1 9 6 z" fill="#fff"/>
  <!-- boîtier au poignet gauche -->
  <rect x="440" y="598" width="40" height="46" rx="6" fill="#e8743b" stroke="#a84c1e" stroke-width="2"/>
  <rect x="436" y="612" width="48" height="12" rx="3" fill="#2b3338" opacity="0.85"/>

  <!-- étiquettes du panneau 1 -->
  <rect x="46" y="762" width="508" height="172" rx="14" fill="#fbf7f2"/>
  <g font-size="16.5" fill="#1f2a30">
    <line x1="270" y1="468" x2="120" y2="784" stroke="#a84c1e" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="62" y="800" font-weight="700" font-size="18" fill="#a84c1e">① Ceinture cardio</text>
    <text x="62" y="826">Sur la peau, sous les</text>
    <text x="62" y="848">pectoraux, le capteur au</text>
    <text x="62" y="870">milieu de la poitrine.</text>
    <text x="62" y="892">Mouille les électrodes.</text>
    <text x="62" y="914">Serrée sans gêner.</text>

    <line x1="462" y1="646" x2="400" y2="784" stroke="#a84c1e" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="316" y="800" font-weight="700" font-size="18" fill="#a84c1e">② Boîtier</text>
    <text x="316" y="826">Dessus de l’avant-bras,</text>
    <text x="316" y="848">juste au-dessus du</text>
    <text x="316" y="870">poignet, tenu par un</text>
    <text x="316" y="892">bracelet à scratch.</text>
    <text x="316" y="914">Détail ci-contre →</text>
  </g>

  <!-- ===== Panneau 2 : la main ===== -->
  <rect x="600" y="120" width="570" height="830" rx="22" fill="#ffffff" stroke="#e2ddd2"/>
  <text x="626" y="162" font-size="22" font-weight="700" fill="#1f2a30">Main gauche, vue de dessus</text>
  <g fill="#f1d9c4" stroke="#c9a88c" stroke-width="2">
    <!-- avant-bras -->
    <path d="M820 700 L960 700 L970 908 L810 908 Z"/>
    <!-- paume / dos de la main -->
    <rect x="800" y="545" width="175" height="175" rx="40"/>
    <!-- doigts : auriculaire, annulaire, majeur, index -->
    <rect x="802" y="440" width="36" height="140" rx="18"/>
    <rect x="845" y="385" width="38" height="190" rx="19"/>
    <rect x="890" y="365" width="38" height="210" rx="19"/>
    <rect x="935" y="395" width="38" height="180" rx="19"/>
    <!-- pouce -->
    <rect x="985" y="560" width="38" height="140" rx="19" transform="rotate(38 1004 640)"/>
  </g>
  <!-- électrodes GSR : index et majeur, 1re phalange -->
  <rect x="886" y="398" width="46" height="26" rx="6" fill="#7d8790" stroke="#4b545b" stroke-width="2"/>
  <rect x="931" y="426" width="46" height="26" rx="6" fill="#7d8790" stroke="#4b545b" stroke-width="2"/>
  <!-- pouls optique : annulaire -->
  <rect x="841" y="414" width="46" height="24" rx="6" fill="#5b55c8" stroke="#3a3591" stroke-width="2"/>
  <!-- boîtier sur l'avant-bras -->
  <rect x="826" y="760" width="128" height="96" rx="10" fill="#e8743b" stroke="#a84c1e" stroke-width="2.5"/>
  <rect x="816" y="772" width="148" height="20" rx="4" fill="#2b3338" opacity="0.85"/>
  <text x="890" y="787" font-size="13" fill="#fff" text-anchor="middle">bracelet</text>
  <text x="890" y="830" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">boîtier</text>
  <!-- câbles qui sortent côté main -->
  <path d="M928 760 C930 700 960 560 954 452" fill="none" stroke="#4b545b" stroke-width="3"/>
  <path d="M916 760 C916 690 912 560 909 424" fill="none" stroke="#4b545b" stroke-width="3"/>
  <path d="M846 760 C846 690 862 560 864 438" fill="none" stroke="#3a3591" stroke-width="3"/>
  <!-- côté USB vers le coude -->
  <path d="M890 862 L890 904" stroke="#a84c1e" stroke-width="3"/>
  <path d="M880 894 L890 908 L900 894" fill="none" stroke="#a84c1e" stroke-width="3"/>

  <g font-size="18" fill="#1f2a30">
    <text x="1000" y="372" font-weight="700" fill="#4b545b">③ Électrodes GSR</text>
    <text x="1000" y="396">bout de l’index</text>
    <text x="1000" y="418">et du majeur</text>
    <text x="1000" y="440">(1re phalange)</text>
    <line x1="978" y1="438" x2="996" y2="420" stroke="#4b545b" stroke-width="2"/>

    <text x="626" y="300" font-weight="700" fill="#3a3591">④ Pouls optique</text>
    <text x="626" y="324">pulpe de l’annulaire,</text>
    <text x="626" y="346">la lumière contre la peau,</text>
    <text x="626" y="368">tenu sans serrer</text>
    <line x1="840" y1="426" x2="790" y2="372" stroke="#3a3591" stroke-width="2"/>

    <text x="626" y="600" font-weight="700" fill="#a84c1e">② Boîtier</text>
    <text x="626" y="624">câbles côté main,</text>
    <text x="626" y="646">prise USB-C côté coude,</text>
    <text x="626" y="668">l’accéléromètre</text>
    <text x="626" y="690">est dedans</text>

    <text x="990" y="880" font-size="16" fill="#5b6770">USB-C, interrupteur</text>
    <text x="990" y="900" font-size="16" fill="#5b6770">et voyant de charge</text>
    <line x1="986" y1="884" x2="904" y2="896" stroke="#a84c1e" stroke-width="1.5"/>
  </g>
  <text x="626" y="930" font-size="16" fill="#5b6770">Peau propre et sèche, sans crème. Main au calme pendant la mesure.</text>
</svg>
